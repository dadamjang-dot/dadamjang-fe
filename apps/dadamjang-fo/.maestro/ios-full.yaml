appId: com.dadamjang.fo
name: iOS authenticated commerce journey
---
- launchApp:
    clearState: true
- openLink: dadamjang://auth/signin
- tapOn:
    id: e2e.auth.userid.input
- inputText: ${E2E_USER_ID}
- tapOn:
    id: e2e.auth.password.input
- inputText: ${E2E_USER_PASSWORD}
- tapOn:
    id: e2e.auth.submit
- openLink: dadamjang://shop
- tapOn:
    id: e2e.wish.add.${E2E_PRODUCT_ID}
- tapOn:
    id: e2e.navigation.wish
- assertVisible:
    id: e2e.wish.remove.${E2E_PRODUCT_ID}
- tapOn:
    id: e2e.wish.remove.${E2E_PRODUCT_ID}
- openLink: dadamjang://product/${E2E_PRODUCT_ID}
- tapOn:
    id: e2e.product.sku.${E2E_SKU_ID}
- tapOn:
    id: e2e.cart.quantity.increment
- tapOn:
    id: e2e.cart.add
- tapOn:
    id: e2e.cart.increment.${E2E_SKU_ID}
- tapOn:
    id: e2e.checkout.submit
- assertVisible:
    id: e2e.checkout.success
- openLink: dadamjang://orders
- assertVisible:
    id: e2e.order.history

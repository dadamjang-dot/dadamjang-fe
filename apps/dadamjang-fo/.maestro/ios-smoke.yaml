appId: com.dadamjang.fo
name: iOS shop filter smoke
---
- launchApp:
    clearState: true
- tapOn:
    id: e2e.navigation.shop
- tapOn:
    id: e2e.filter.open.category
- tapOn:
    id: e2e.filter.apply
- tapOn:
    id: e2e.product.open.${E2E_PRODUCT_ID}
- tapOn:
    id: e2e.product.sku.${E2E_SKU_ID}
- assertVisible:
    id: e2e.product.buy

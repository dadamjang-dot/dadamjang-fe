name: Frontend static checks

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm partner:format
      - run: pnpm partner:lint
      - run: pnpm partner:typecheck
      - run: pnpm partner:fsd
      - run: pnpm partner:test
      - run: pnpm partner:build
      - run: pnpm fo:lint
      - run: pnpm fo:typecheck
      - run: pnpm fo:verify:autolinking
      - run: pnpm fo:test:unit
      - run: pnpm fo:test:integration
      - run: pnpm fo:test:android
      - run: pnpm fo:verify:android-export
      - run: pnpm bo:lint
      - run: pnpm bo:typecheck
      - run: pnpm bo:fsd
      - run: pnpm bo:test
      - run: pnpm bo:build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/dadamjang-partner exec playwright install --with-deps chromium
      - run: pnpm partner:test:e2e
      - run: pnpm bo:test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            apps/dadamjang-partner/playwright-report
            apps/dadamjang-partner/test-results
            apps/dadamjang-bo/playwright-report
            apps/dadamjang-bo/test-results

name: Frontend static checks

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DADAMJANG_IMAGE_ORIGINS: https://images.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm partner:lint
      - run: pnpm partner:typecheck
      - run: pnpm partner:fsd
      - run: pnpm partner:test
      - run: pnpm partner:build
      - run: pnpm fo:lint
      - run: pnpm fo:typecheck
      - run: pnpm fo:verify:autolinking
      - run: pnpm fo:test:unit
      - run: pnpm fo:test:integration
      - run: pnpm fo:test:android
      - run: pnpm fo:verify:android-export
      - run: pnpm bo:lint
      - run: pnpm bo:typecheck
      - run: pnpm bo:fsd
      - run: pnpm bo:test
      - run: pnpm bo:build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DADAMJANG_IMAGE_ORIGINS: https://images.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/dadamjang-partner exec playwright install --with-deps chromium
      - run: pnpm partner:test:e2e
      - run: pnpm bo:test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-e2e-artifacts
          path: |
            apps/dadamjang-partner/playwright-report
            apps/dadamjang-partner/test-results
            apps/dadamjang-bo/playwright-report
            apps/dadamjang-bo/test-results

name: Mobile E2E smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ios-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: mobile-e2e
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/dadamjang-fo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: 23.0.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Maestro 2.9.0
        run: |
          maestro_archive="$RUNNER_TEMP/maestro.zip"
          maestro_root="$RUNNER_TEMP/maestro-cli"
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.9.0/maestro.zip -o "$maestro_archive"
          echo "855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd  $maestro_archive" | shasum -a 256 -c -
          mkdir -p "$maestro_root"
          unzip -q "$maestro_archive" -d "$maestro_root"
          maestro_bin="$(find "$maestro_root" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: eas build --platform ios --profile e2e --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.E2E_API_URL }}
      - run: |
          mkdir -p .maestro-artifacts/debug .maestro-artifacts/screenshots "$RUNNER_TEMP/dadamjang-e2e-app"
          curl -fsSL "$(jq -r '.[0].artifacts.buildUrl' eas-build.json)" -o "$RUNNER_TEMP/dadamjang-e2e-app.tar.gz"
          tar -xzf "$RUNNER_TEMP/dadamjang-e2e-app.tar.gz" -C "$RUNNER_TEMP/dadamjang-e2e-app"
          xcrun simctl boot "iPhone 16" || true
          open -a Simulator
          xcrun simctl bootstatus booted -b
          xcrun simctl install booted "$(find "$RUNNER_TEMP/dadamjang-e2e-app" -name '*.app' -type d | head -1)"
          xcrun simctl io booted recordVideo .maestro-artifacts/video.mp4 &
          video_pid=$!
          finish_video() {
            if [ -n "${video_pid:-}" ]; then
              kill -INT "$video_pid" 2>/dev/null || true
              wait "$video_pid" 2>/dev/null || true
              video_pid=
            fi
          }
          trap finish_video EXIT
          trap 'exit 130' INT TERM
          maestro test --format junit --output .maestro-artifacts/junit.xml --test-output-dir .maestro-artifacts/screenshots --debug-output .maestro-artifacts/debug .maestro/ios-smoke.yaml
        env:
          E2E_PRODUCT_ID: ${{ vars.E2E_PRODUCT_ID }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-smoke-maestro
          path: apps/dadamjang-fo/.maestro-artifacts
          retention-days: 7

  android-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: mobile-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/dadamjang-fo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: 23.0.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Maestro 2.9.0
        run: |
          maestro_archive="$RUNNER_TEMP/maestro.zip"
          maestro_root="$RUNNER_TEMP/maestro-cli"
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.9.0/maestro.zip -o "$maestro_archive"
          echo "855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd  $maestro_archive" | shasum -a 256 -c -
          mkdir -p "$maestro_root"
          unzip -q "$maestro_archive" -d "$maestro_root"
          maestro_bin="$(find "$maestro_root" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: eas build --platform android --profile e2e --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.E2E_API_URL }}
      - run: curl -fsSL "$(jq -r '.[0].artifacts.buildUrl' eas-build.json)" -o "$RUNNER_TEMP/dadamjang-e2e-app.apk"
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          working-directory: apps/dadamjang-fo
          script: |
            adb install -r "$RUNNER_TEMP/dadamjang-e2e-app.apk"
            mkdir -p .maestro-artifacts/debug .maestro-artifacts/screenshots
            adb shell screenrecord /sdcard/maestro.mp4 &
            video_pid=$!
            finish_video() {
              kill "$video_pid" 2>/dev/null || true
              adb shell pkill -INT screenrecord || true
              adb pull /sdcard/maestro.mp4 .maestro-artifacts/video.mp4 || true
            }
            trap finish_video EXIT
            trap 'exit 130' INT TERM
            maestro test --format junit --output .maestro-artifacts/junit.xml --test-output-dir .maestro-artifacts/screenshots --debug-output .maestro-artifacts/debug .maestro/android-smoke.yaml
        env:
          E2E_PRODUCT_ID: ${{ vars.E2E_PRODUCT_ID }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-smoke-maestro
          path: apps/dadamjang-fo/.maestro-artifacts
          retention-days: 7

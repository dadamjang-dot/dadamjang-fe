name: Mobile E2E smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: mobile-e2e
  cancel-in-progress: true

jobs:
  ios-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: mobile-e2e
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/dadamjang-fo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: mobile-dev-inc/action-maestro@v1
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: eas build --platform ios --profile e2e --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.E2E_API_URL }}
      - run: |
          mkdir -p .maestro-artifacts/app .maestro-artifacts/debug .maestro-artifacts/screenshots
          curl -fsSL "$(jq -r '.[0].artifacts.buildUrl' eas-build.json)" -o .maestro-artifacts/app.tar.gz
          tar -xzf .maestro-artifacts/app.tar.gz -C .maestro-artifacts/app
          xcrun simctl boot "iPhone 16" || true
          open -a Simulator
          xcrun simctl bootstatus booted -b
          xcrun simctl install booted "$(find .maestro-artifacts/app -name '*.app' -type d | head -1)"
          xcrun simctl io booted recordVideo .maestro-artifacts/video.mp4 &
          video_pid=$!
          finish_video() {
            if [ -n "${video_pid:-}" ]; then
              kill -INT "$video_pid" 2>/dev/null || true
              wait "$video_pid" 2>/dev/null || true
              video_pid=
            fi
          }
          trap finish_video EXIT
          trap 'exit 130' INT TERM
          maestro test --format junit --output .maestro-artifacts/junit.xml --test-output-dir .maestro-artifacts/screenshots --debug-output .maestro-artifacts/debug .maestro/ios-smoke.yaml
        env:
          E2E_PRODUCT_ID: ${{ vars.E2E_PRODUCT_ID }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-maestro
          path: apps/dadamjang-fo/.maestro-artifacts

  android-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: mobile-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/dadamjang-fo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: mobile-dev-inc/action-maestro@v1
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: eas build --platform android --profile e2e --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.E2E_API_URL }}
      - run: mkdir -p .maestro-artifacts && curl -fsSL "$(jq -r '.[0].artifacts.buildUrl' eas-build.json)" -o .maestro-artifacts/app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          working-directory: apps/dadamjang-fo
          script: |
            adb install -r .maestro-artifacts/app.apk
            mkdir -p .maestro-artifacts/debug .maestro-artifacts/screenshots
            adb shell screenrecord /sdcard/maestro.mp4 &
            video_pid=$!
            finish_video() {
              kill "$video_pid" 2>/dev/null || true
              adb shell pkill -INT screenrecord || true
              adb pull /sdcard/maestro.mp4 .maestro-artifacts/video.mp4 || true
            }
            trap finish_video EXIT
            trap 'exit 130' INT TERM
            maestro test --format junit --output .maestro-artifacts/junit.xml --test-output-dir .maestro-artifacts/screenshots --debug-output .maestro-artifacts/debug .maestro/android-smoke.yaml
        env:
          E2E_PRODUCT_ID: ${{ vars.E2E_PRODUCT_ID }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-maestro
          path: apps/dadamjang-fo/.maestro-artifacts
